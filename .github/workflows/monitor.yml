name: Monitor RX7600

on: 
  schedule:
    - cron: '0 */3 * * *'
    workflow_dispatch:

jobs:
  run-script: 
  runs-on: ubuntu-latest

  steps: 
    - uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Install Chrome
      run: |
        sudo apt update
        sudo apt install -y chromium-browser

    - name: Run script
      run: |
        python monitor.py